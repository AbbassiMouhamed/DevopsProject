# ── Authentication ────────────────────────────────────────────────────────────
sonar.host.url=${env.SONAR_HOST_URL}
sonar.token=${env.SONAR_TOKEN}

# ── Project identity ──────────────────────────────────────────────────────────
sonar.projectKey=smartlingua
sonar.projectName=SmartLingua
sonar.projectVersion=1.0

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.idea/**,**/.mvn/**
sonar.coverage.exclusions=**/config/**,**/*Application.java,**/*Config.java

# ── Coverage ──────────────────────────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=backend/**/target/site/jacoco/jacoco.xml
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*Tests.java
sonar.javascript.lcov.reportPaths=frontend/coverage/**/lcov.info

# ── Language settings ─────────────────────────────────────────────────────────
sonar.java.source=21
sonar.java.target=21
