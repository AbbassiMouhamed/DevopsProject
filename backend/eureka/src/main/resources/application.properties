spring.application.name=eureka
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
server.port=8761
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable self-preservation mode (dev/Docker env: containers stop sending
# heartbeats on restart → Eureka must expire stale registrations immediately)
eureka.server.enable-self-preservation=false
eureka.server.renewal-percent-threshold=0.49
eureka.server.eviction-interval-timer-in-ms=5000

# Allow faster de-registration when a microservice disappears
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
