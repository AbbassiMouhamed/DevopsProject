apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smartlingua
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: smartlingua/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef:
                name: smartlingua-env
          env:
            - name: SERVER_PORT
              value: "8093"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8093
            initialDelaySeconds: 50
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smartlingua
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8093
      targetPort: 8093
      nodePort: 30093
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartlingua-ingress
  namespace: smartlingua
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: smartlingua.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8093
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
