################################################################################
# Keycloak Deployment
#
# Image: quay.io/keycloak/keycloak (official registry — Docker Hub mirror
#        "keycloak/keycloak" does NOT exist and will fail ImagePullBackOff)
#
# Pre-requisite: create the realm ConfigMap before applying:
#   kubectl create configmap keycloak-realm \
#     --from-file=smartlingua-realm.json=keycloak/smartlingua-realm.json \
#     -n smartlingua
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: smartlingua
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # Official Keycloak image lives on quay.io, NOT Docker Hub.
          # "keycloak/keycloak" on Docker Hub does not exist → ImagePullBackOff.
          image: quay.io/keycloak/keycloak:25.0.6
          args:
            - start-dev
            - --health-enabled=true # required for /health/ready probe to return 200
            - --import-realm # auto-import any JSON in /opt/keycloak/data/import/
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: smartlingua-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlingua-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            # Disable hostname strict mode for dev/K8s local clusters
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: smartlingua
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
