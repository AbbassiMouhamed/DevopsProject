apiVersion: v1
kind: ConfigMap
metadata:
  name: smartlingua-env
  namespace: smartlingua
data:
  # ── Spring Cloud ─────────────────────────────────────────────────────────────
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka"
  SPRING_CLOUD_CONFIG_URI: "http://config-server:8890"

  # ── Database ─────────────────────────────────────────────────────────────────
  SPRING_DATASOURCE_USERNAME: "root"
  MYSQL_HOST: "mysql"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/smartlingua"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: "http://keycloak:8080/realms/smartlingua"
---
apiVersion: v1
kind: Secret
metadata:
  name: smartlingua-secrets
  namespace: smartlingua
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "root"
  MYSQL_ROOT_PASSWORD: "root"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  OPENAI_API_KEY: "change-me"
