apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: smartlingua
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: smartlingua/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8890
          env:
            - name: SERVER_PORT
              value: "8890"
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: smartlingua-env
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8890
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: smartlingua
spec:
  selector:
    app: config-server
  ports:
    - port: 8890
      targetPort: 8890
  type: ClusterIP
