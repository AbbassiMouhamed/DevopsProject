# ── ai-assistant ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  namespace: smartlingua
  labels:
    app: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-assistant
  template:
    metadata:
      labels:
        app: ai-assistant
    spec:
      containers:
        - name: ai-assistant
          image: smartlingua/ai-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8095
          envFrom:
            - configMapRef:
                name: smartlingua-env
            - secretRef:
                name: smartlingua-secrets
          env:
            - name: SERVER_PORT
              value: "8095"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/smartlingua_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_AI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartlingua-secrets
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8095
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant
  namespace: smartlingua
spec:
  selector:
    app: ai-assistant
  ports:
    - port: 8095
      targetPort: 8095
  type: ClusterIP
