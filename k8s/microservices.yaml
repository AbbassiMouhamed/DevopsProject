################################################################################
# SmartLingua — All Microservices Kubernetes Deployments + Services
# Apply: kubectl apply -f k8s/microservices.yaml
################################################################################

# ── users ──────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: smartlingua
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: smartlingua/users:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: smartlingua-env
            - secretRef:
                name: smartlingua-secrets
          env:
            - name: SERVER_PORT
              value: "8087"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/smartlingua_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: smartlingua
spec:
  selector:
    app: users
  ports:
    - port: 8087
      targetPort: 8087
  type: ClusterIP
---
