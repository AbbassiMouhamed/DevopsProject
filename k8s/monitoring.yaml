################################################################################
# SmartLingua — Prometheus + Grafana on Kubernetes
################################################################################

# ── Prometheus ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smartlingua
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'config-server'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['config-server:8890']
      - job_name: 'eureka'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['eureka:8761']
      - job_name: 'api-gateway'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway:8093']
      - job_name: 'users'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['users:8087']
      - job_name: 'courses'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['courses:8086']
      - job_name: 'quiz'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['quiz:8088']
      - job_name: 'exams'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['exams:8089']
      - job_name: 'messaging'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['messaging:8092']
      - job_name: 'privetcours'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['privetcours:8091']
      - job_name: 'forum'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['forum:8096']
      - job_name: 'adaptive-learning'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['adaptive-learning:8094']
      - job_name: 'ai-assistant'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ai-assistant:8095']
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: smartlingua
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: smartlingua
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "1Gi", cpu: "500m" }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: smartlingua
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
---
# ── Grafana ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: smartlingua
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: smartlingua
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "300m" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: smartlingua
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
  type: NodePort
