# SmartLingua — Full Stack Docker Compose
# Usage:
#   docker compose up -d                  → start everything
#   docker compose up -d eureka keycloak  → start infra only
#   docker compose logs -f users          → tail logs
#   docker compose down -v                → stop + remove volumes

name: smartlingua

# ── Shared environment defaults ────────────────────────────────────────────────
x-mysql-env: &mysql-env
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root

x-spring-common: &spring-common
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
  SPRING_CLOUD_CONFIG_URI: http://config-server:8890
  CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://frontend"
  KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/smartlingua

x-healthcheck-defaults: &hc-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: smartlingua-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartlingua
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init-central-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  keycloak:
    image: keycloak/keycloak:25.0.6
    container_name: smartlingua-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/smartlingua-realm.json:/opt/keycloak/data/import/smartlingua-realm.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fs http://localhost:9000/health/ready || exit 1"]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  eureka:
    build:
      context: ./backend/eureka
      dockerfile: Dockerfile
    image: smartlingua/eureka:latest
    container_name: smartlingua-eureka
    environment:
      SERVER_PORT: "8761"
      EUREKA_CLIENT_REGISTER-WITH-EUREKA: "false"
      EUREKA_CLIENT_FETCH-REGISTRY: "false"
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8761/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  config-server:
    build:
      context: ./backend/config-server
      dockerfile: Dockerfile
    image: smartlingua/config-server:latest
    container_name: smartlingua-config-server
    environment:
      SERVER_PORT: "8890"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_PROFILES_ACTIVE: native
    ports:
      - "8890:8890"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8890/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  api-gateway:
    build:
      context: ./backend/apiGateway
      dockerfile: Dockerfile
    image: smartlingua/api-gateway:latest
    container_name: smartlingua-api-gateway
    environment:
      SERVER_PORT: "8093"
      <<: *spring-common
    ports:
      - "8093:8093"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8093/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  # ──────────────────────────────────────────────────────────────────────────────
  # MICROSERVICES
  # ──────────────────────────────────────────────────────────────────────────────

  users:
    build:
      context: ./backend/microservices/users
      dockerfile: Dockerfile
    image: smartlingua/users:latest
    container_name: smartlingua-users
    environment:
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      <<: [*mysql-env, *spring-common]
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://keycloak:8080/realms/smartlingua
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8087/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  courses:
    build:
      context: ./backend/microservices/courses
      dockerfile: Dockerfile
    image: smartlingua/courses:latest
    container_name: smartlingua-courses
    environment:
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_courses?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      <<: [*mysql-env, *spring-common]
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8086/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  quiz:
    build:
      context: ./backend/microservices/quiz
      dockerfile: Dockerfile
    image: smartlingua/quiz:latest
    container_name: smartlingua-quiz
    environment:
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_quiz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      <<: [*mysql-env, *spring-common]
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8088/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  exams:
    build:
      context: ./backend/microservices/exams
      dockerfile: Dockerfile
    image: smartlingua/exams:latest
    container_name: smartlingua-exams
    environment:
      SERVER_PORT: "8089"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_exams?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      <<: [*mysql-env, *spring-common]
    ports:
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8089/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  forum:
    build:
      context: ./backend/microservices/forum
      dockerfile: Dockerfile
    image: smartlingua/forum:latest
    container_name: smartlingua-forum
    environment:
      SERVER_PORT: "8096"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_forum?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      <<: [*mysql-env, *spring-common]
    ports:
      - "8096:8096"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8096/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  messaging:
    build:
      context: ./backend/microservices/messaging
      dockerfile: Dockerfile
    image: smartlingua/messaging:latest
    container_name: smartlingua-messaging
    environment:
      SERVER_PORT: "8092"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_messaging?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      <<: [*mysql-env, *spring-common]
    ports:
      - "8092:8092"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8092/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  privetcours:
    build:
      context: ./backend/microservices/privetcours
      dockerfile: Dockerfile
    image: smartlingua/privetcours:latest
    container_name: smartlingua-privetcours
    environment:
      SERVER_PORT: "8091"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_privetcours?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      <<: [*mysql-env, *spring-common]
    ports:
      - "8091:8091"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8091/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  adaptive-learning:
    build:
      context: ./backend/microservices/adaptive-learning
      dockerfile: Dockerfile
    image: smartlingua/adaptive-learning:latest
    container_name: smartlingua-adaptive-learning
    environment:
      SERVER_PORT: "8094"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_adaptive?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder-set-real-key-to-enable-ai}
      ADAPTIVE_AI_ENABLED: "false"
      <<: [*mysql-env, *spring-common]
    ports:
      - "8094:8094"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8094/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  ai-assistant:
    build:
      context: ./backend/microservices/ai-assistant-service
      dockerfile: Dockerfile
    image: smartlingua/ai-assistant:latest
    container_name: smartlingua-ai-assistant
    environment:
      SERVER_PORT: "8095"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartlingua_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_AI_OPENAI_API_KEY: "${OPENAI_API_KEY:-change-me}"
      <<: [*mysql-env, *spring-common]
    ports:
      - "8095:8095"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8095/actuator/health | grep -q ''"status":"UP"''',
        ]
      <<: *hc-defaults
    networks:
      - smartlingua-net

  # ──────────────────────────────────────────────────────────────────────────────
  # FRONTEND
  # ──────────────────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smartlingua/frontend:latest
    container_name: smartlingua-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - smartlingua-net

  # ──────────────────────────────────────────────────────────────────────────────
  # MONITORING
  # ──────────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: smartlingua-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    networks:
      - smartlingua-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: smartlingua-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/smartlingua.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - smartlingua-net

  # ──────────────────────────────────────────────────────────────────────────────
  # CI/CD
  # ──────────────────────────────────────────────────────────────────────────────

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: smartlingua/jenkins:latest
    container_name: smartlingua-jenkins
    ports:
      - "8080:8080"   # Web UI
      - "50000:50000" # Agent JNLP
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker via host socket
    restart: unless-stopped
    networks:
      - smartlingua-net

# ──────────────────────────────────────────────────────────────────────────────
# VOLUMES & NETWORKS
# ──────────────────────────────────────────────────────────────────────────────

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  jenkins_home:

networks:
  smartlingua-net:
    driver: bridge
